[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-ai-inference-control-plane"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.40,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "opentelemetry-api>=1.31,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.31,<2",
  "opentelemetry-sdk>=1.31,<2",
  "prometheus-client>=0.21,<1",
  "pydantic>=2.10,<3",
  "redis>=6.0,<7",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = ["mypy>=1.15,<2", "pytest>=8.3,<9", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["control_plane*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["control_plane"]
