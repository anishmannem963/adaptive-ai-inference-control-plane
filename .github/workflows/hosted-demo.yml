name: Hosted demo validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/hosted-demo.yml"
      - "control_plane/evaluation/cloud.py"
      - "dashboard/**"
      - "render.yaml"
      - "scripts/validate_cloud_gateway.py"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && pip install .
      - name: Validate free hosted gateway
        run: |
          python scripts/validate_cloud_gateway.py \
            --base-url "https://adaptive-ai-inference-control-plane-api.onrender.com" \
            --requests 25 \
            --expected-cache-backend redis \
            --allowed-origin "https://adaptive-ai-inference-control-plane.netlify.app" \
            --output artifacts/free-render-validation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: free-render-validation-${{ github.run_id }}
          path: artifacts/free-render-validation.json
          if-no-files-found: error
          retention-days: 30
