name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 10
    env:
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest
      - run: python scripts/validate_dashboard.py
      - run: docker build -t adaptive-ai-inference-control-plane:ci .

  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.18.4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
      - run: helm lint deploy/helm/control-plane
      - run: helm template iteration8 deploy/helm/control-plane --set redis.enabled=true > /tmp/rendered.yaml
      - run: terraform fmt -check -recursive infra/terraform
      - run: terraform -chdir=infra/terraform/cloud-run init -backend=false
      - run: terraform -chdir=infra/terraform/cloud-run validate
      - uses: helm/kind-action@v1
        with:
          cluster_name: control-plane
      - run: kubectl kustomize deploy/kubernetes/base > /tmp/kubernetes-base.yaml
      - run: kubectl apply --dry-run=client --validate=false -k deploy/kubernetes/base
      - run: docker build -t adaptive-ai-inference-control-plane:ci .
      - run: kind load docker-image adaptive-ai-inference-control-plane:ci --name control-plane
      - name: Install chart and wait for workloads
        run: |
          helm upgrade --install iteration8 deploy/helm/control-plane \
            --namespace inference-system \
            --create-namespace \
            --set image.tag=ci \
            --set image.pullPolicy=Never \
            --set redis.enabled=true
          kubectl -n inference-system rollout status deployment/iteration8-control-plane --timeout=120s
          kubectl -n inference-system rollout status deployment/iteration8-control-plane-redis --timeout=120s
      - name: Diagnose failed rollout
        if: failure()
        run: |
          kubectl -n inference-system get pods -o wide
          kubectl -n inference-system describe pods
          kubectl -n inference-system logs -l app.kubernetes.io/instance=iteration8 --all-containers --tail=100 || true
      - name: Smoke test kind deployment
        run: |
          kubectl -n inference-system port-forward service/iteration8-control-plane 18080:80 >/tmp/port-forward.log 2>&1 &
          forward_pid=$!
          trap 'kill "$forward_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/health/live | grep -q '"status":"alive"'; then
              curl --fail --silent \
                -H 'Content-Type: application/json' \
                -d '{"model":"mock-fast","messages":[{"role":"user","content":"kind smoke test"}]}' \
                http://127.0.0.1:18080/v1/chat/completions | grep -q 'mock-fast'
              exit 0
            fi
            sleep 2
          done
          cat /tmp/port-forward.log
          exit 1

  evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CACHE_ENABLED: "false"
      MOCK_PROVIDERS_ENABLED: "true"
      OLLAMA_ENABLED: "false"
      AWS_BEDROCK_ENABLED: "false"
      PROVIDER_RATE_PER_SECOND: "100000"
      PROVIDER_BURST_CAPACITY: "100000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Start zero-cost gateway
        run: |
          uvicorn control_plane.main:app --host 127.0.0.1 --port 8080 >/tmp/gateway.log 2>&1 &
          echo $! > /tmp/gateway.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/health/ready >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/gateway.log
          exit 1
      - name: Run bounded load gate
        run: |
          python scripts/run_load_benchmark.py \
            --requests 100 \
            --repetitions 1 \
            --concurrency 20 \
            --output artifacts/ci-load-benchmark.json
      - name: Run bounded fault gate
        run: |
          python scripts/run_fault_matrix.py \
            --repetitions 2 \
            --output artifacts/ci-fault-matrix.json
      - name: Stop gateway
        if: always()
        run: |
          if test -f /tmp/gateway.pid; then
            kill "$(cat /tmp/gateway.pid)" || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iteration-9-ci-evaluation-${{ github.run_id }}
          path: artifacts/*.json
          if-no-files-found: error
          retention-days: 7
