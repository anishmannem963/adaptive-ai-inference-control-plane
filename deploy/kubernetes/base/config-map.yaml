apiVersion: v1
kind: ConfigMap
metadata:
  name: inference-gateway-config
  namespace: inference-system
data:
  APP_ENV: production
  MOCK_PROVIDERS_ENABLED: "true"
  OLLAMA_ENABLED: "false"
  AWS_BEDROCK_ENABLED: "false"
  AWS_SESSION_BUDGET_USD: "0"
  CACHE_ENABLED: "true"
  CACHE_TTL_SECONDS: "300"
  IDEMPOTENCY_TTL_SECONDS: "86400"
  OTEL_SERVICE_NAME: adaptive-ai-inference-control-plane
  TELEMETRY_RECENT_EVENTS_LIMIT: "100"
  CORS_ALLOWED_ORIGINS: https://adaptive-ai-inference-control-plane.netlify.app
