services:
  - type: web
    name: adaptive-ai-inference-control-plane-api
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ENV
        value: free-hosted-demo
      - key: MOCK_PROVIDERS_ENABLED
        value: "true"
      - key: OLLAMA_ENABLED
        value: "false"
      - key: AWS_BEDROCK_ENABLED
        value: "false"
      - key: AWS_SESSION_BUDGET_USD
        value: "0"
      - key: CACHE_ENABLED
        value: "true"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: adaptive-ai-inference-control-plane-cache
          property: connectionString
      - key: CACHE_TTL_SECONDS
        value: "300"
      - key: IDEMPOTENCY_TTL_SECONDS
        value: "86400"
      - key: OTEL_SERVICE_NAME
        value: adaptive-ai-inference-control-plane
      - key: TELEMETRY_RECENT_EVENTS_LIMIT
        value: "100"
      - key: PROVIDER_RATE_PER_SECOND
        value: "100"
      - key: PROVIDER_BURST_CAPACITY
        value: "100"
      - key: CORS_ALLOWED_ORIGINS
        value: https://adaptive-ai-inference-control-plane.netlify.app

  - type: keyvalue
    name: adaptive-ai-inference-control-plane-cache
    plan: free
    region: virginia
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru
    persistenceMode: off

previews:
  generation: off
